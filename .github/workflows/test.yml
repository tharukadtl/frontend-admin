name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No .nvmrc/engines field pins a version anywhere in this project (confirmed, not assumed) --
      # 20 matches the same choice already verified for SLTMobileApp this session.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Only the Jest unit tests (src/**/*.test.js) -- the Cypress e2e suite under cypress/e2e/ is
      # deliberately not run here yet. Of 28 specs, 21 are fully self-contained (no backend needed)
      # but 6 require a live fieldops backend with a specific seeded admin user, and 2 of those 6
      # additionally require the real, already-imported master-data hierarchy (specific real
      # Opmc/Exchange/Cab/Dp/Circuit and TypeOfFault/CauseCategory/CauseOfFault codes) that has no
      # CI-portable equivalent yet -- see QA_Compliance_Consolidated_Report.md's frontend-admin CI
      # entry for the full breakdown and recommendation. Scoped out as a deliberate follow-up
      # rather than blocking this pipeline on it.
      # jest-junit reads its config from JEST_JUNIT_* env vars rather than a
      # package.json/jest.config.js edit, since CRA's react-scripts restricts
      # overriding several jest config keys without ejecting -- --reporters is
      # a plain CLI flag react-scripts test forwards straight to the
      # underlying Jest CLI, so this needs neither.
      - name: Run tests
        env:
          JEST_JUNIT_OUTPUT_DIR: reports
          JEST_JUNIT_OUTPUT_NAME: jest-junit.xml
        run: npm test -- --reporters=default --reporters=jest-junit

      # if: always() so a summary appears even when tests fail. ubuntu-latest
      # ships python3 by default, no setup step needed.
      - name: Test summary
        if: always()
        run: python3 .github/scripts/summarize_junit.py "reports/jest-junit.xml"
