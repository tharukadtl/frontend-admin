# Server block for frontend-admin's static React build -- dropped into the base
# nginx:alpine image's conf.d/, which its own top-level nginx.conf already includes.
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA client-side routing (React Router): a real browser refresh/deep-link on a
    # route like /faults has no matching file or directory under root, so without
    # this nginx would 404 it directly instead of letting index.html load and the
    # router take over client-side. Try the literal file, then the literal
    # directory, then fall back to index.html rather than a real 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip static assets (JS/CSS/etc. from the CRA build) -- these are the
    # bulk of a real page load's transfer size.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # CRA's build output hashes JS/CSS filenames (main.<hash>.js), so those are safe
    # to cache aggressively; index.html itself must never be cached, since it's the
    # one file whose content (which hashed bundle it references) actually changes
    # on every deploy.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
